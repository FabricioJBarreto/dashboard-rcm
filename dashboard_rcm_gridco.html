// ─── API FRACTTAL ─────────────────────────────────────────────────────────────
const API_BASE  = window.location.hostname === "localhost" ? "/proxy/api" : "https://app.fracttal.com/api";
const TOKEN_URL = window.location.hostname === "localhost" ? "/proxy/oauth/token" : "https://app.fracttal.com/oauth/token";
const CID       = "chLGln7rU7ymgyJFfP";
const CSEC      = "qj19Xd3eonUOjjadI5zLbBNVd84iXJaH";
let _tok = null, _tokExp = 0;

async function getToken() {
  if (_tok && Date.now() < _tokExp) return _tok;
  // Fracttal usa Basic Auth: Authorization: Basic base64(client_id:client_secret)
  const basicAuth = btoa(CID + ":" + CSEC);
  // Suporte a path relativo (proxy local) e URL absoluta (produção)
  const tokenUrl = TOKEN_URL.startsWith("http") ? TOKEN_URL : (window.location.origin + TOKEN_URL);
  const r = await fetch(tokenUrl, {
    method:"POST",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded",
      "Authorization":"Basic " + basicAuth,
    },
    body: new URLSearchParams({ grant_type:"client_credentials" }),
  });
  if (!r.ok) {
    const txt = await r.text().catch(()=>"");
    throw new Error("Auth " + r.status + ": " + txt.slice(0,60));
  }
  const d = await r.json();
  _tok = d.access_token;
  _tokExp = Date.now() + (d.expires_in - 60) * 1000;
  return _tok;
}

async function apiFetch(endpoint, params={}) {
  const token = await getToken();
  // Suporte a path relativo (proxy local) e URL absoluta (produção)
  const base = API_BASE.startsWith("http") ? API_BASE : (window.location.origin + API_BASE);
  const url = new URL(base + endpoint);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const r = await fetch(url.toString(), { headers:{ Authorization:"Bearer "+token } });
  if (!r.ok) throw new Error(endpoint + " → " + r.status);
  return r.json();
}

// ─── HOOK FRACTTAL ────────────────────────────────────────────────────────────
function useFracttal() {
  const [status, setStatus] = useState("idle");
  const [os, setOs] = useState([]);
  const [err, setErr] = useState(null);

  const load = useCallback(async () => {
    setStatus("loading"); setErr(null);
    try {
      const hoje = new Date();
      const inicioAno = new Date(hoje.getFullYear(), 0, 1);
      const fmt = d => d.toISOString().split("T")[0];
      // work_orders_tasks: offset>0 retorna 400 — API limita a 1 página
      // Estratégia: buscar por faixas de folio/id usando wo_folio como cursor
      // Fallback: buscar work_orders com paginação (retorna 1 por OS mas funciona)
      const allItems = [];

      // Tentar work_orders_tasks sem filtros (retorna as mais recentes)
      const base = await apiFetch("/work_orders_tasks", { limit:500 }).catch(()=>null);
      const baseItems = base?.data || base?.results || base?.items || [];
      if (Array.isArray(baseItems)) allItems.push(...baseItems);

      // Complementar com work_orders paginado (para KPIs de manutenção)
      const woPgs = await Promise.all([0,500,1000,1500,2000,2500,3000,3500,4000,4500,5000,5500,
        6000,6500,7000,7500,8000,8500,9000,9500,10000,10500].map(off =>
          apiFetch("/work_orders", {
            limit:500, offset:off,
            date_creation_start:fmt(inicioAno), date_creation_end:fmt(hoje),
          }).catch(()=>null)
      ));
      const woItems = woPgs.flatMap(p=>{
        const d = p?.data || p?.results || p?.items || [];
        return Array.isArray(d)?d:[];
      });

      // Usar work_orders como base (tem creation_date) + tasks para enriquecer
      const finalItems = woItems.length > allItems.length ? woItems : allItems;
      if(finalItems.length>0) {
        console.log("[DEBUG] Usando:", woItems.length>allItems.length?"work_orders":"work_orders_tasks",
          "| total:", finalItems.length, "| campos:", Object.keys(finalItems[0]||{}));
      }
      setOs(finalItems);
      setStatus("ok");
    } catch(e) {
      setErr(e.message);
      setStatus("error");
    }
  }, []);

  useEffect(() => { load(); }, []);
  return { status, os, err, load };
}

function calcKPIs(os) {
  if (!os.length) return null;
  // Campos reais do Fracttal confirmados pelo debug:
  // id_status_work_order: 3=Finalizado
  // tasks_log_task_type_main: tipo (CORRETIVA/PREVENTIVA)
  // trigger_description: NO_SCHEDULE_TASK = não programada
  // real_duration: duração real em segundos
  const fin  = os.filter(o => Number(o.id_status_work_order) === 3);
  const corr = os.filter(o => {
    const t = (o.tasks_log_task_type_main || o.task_type || "").toUpperCase();
    return t.includes("CORRET") || t.includes("EMERG");
  });
  const prev = os.filter(o => {
    const t = (o.tasks_log_task_type_main || o.task_type || "").toUpperCase();
    return t.includes("PREVENT");
  });
  const prog = os.filter(o => {
    const a = (o.trigger_description || o.activator || "").toUpperCase();
    return !a.includes("NO_SCHEDULE") && !a.includes("NAO_PROGRAM");
  });
  const nprog = os.filter(o => {
    const a = (o.trigger_description || o.activator || "").toUpperCase();
    return a.includes("NO_SCHEDULE") || a.includes("NAO_PROGRAM");
  });
  const pfin = prog.filter(o => Number(o.id_status_work_order) === 3);
  const ttrs = fin.map(o => {
    const d = parseFloat(o.real_duration || o.duration || 0);
    return d > 0 ? (d > 1000 ? d/3600 : d) : 0; // seg→h se >1000, senão já é hora
  }).filter(v => v > 0 && v < 200);
  const mttr = ttrs.length ? ttrs.reduce((a,b)=>a+b,0)/ttrs.length : 0;
  const pct = (n,d) => d ? ((n/d)*100).toFixed(1) : "0";
  return {
    total:os.length, fin:fin.length, corr:corr.length, prev:prev.length,
    prog:prog.length, nprog:nprog.length,
    mttr: mttr.toFixed(2),
    taxaRes: pct(fin.length, os.length),
    cumprimento: pct(pfin.length, prog.length),
    pctCorr: pct(corr.length, os.length),
    pctPrev: pct(prev.length, os.length),
    pctProg: pct(prog.length, os.length),
    pctNProg: pct(nprog.length, os.length),
  };
}


// ─── ABA CURVA S ──────────────────────────────────────────────────────────────
function CurvaSTab({ os, apiStatus }) {
  const semMap = useMemo(() => {
    const m = {};
    os.forEach(o => {
      // Fracttal: tentar todos os campos de data conhecidos
      // Campo confirmado pelo debug: cal_date_maintenance = Data Calculada da Manutenção
      const ds = o.cal_date_maintenance || o.date_maintenance || 
                 o.creation_date || o.initial_date || o.final_date;
      if (!ds) return;
      const d = new Date(ds); if (isNaN(d)) return;
      const ini = new Date(d.getFullYear(),0,1);
      const s = Math.ceil(((d-ini)/86400000+ini.getDay()+1)/7);
      m[s] = (m[s]||0)+1;
    });
    return m;
  }, [os]);

  const totalPCM = 11711;
  // OS planejadas acumuladas até semana atual (absoluto)
  const pcmAteSem = (PCM.find(d=>d.s===SEM)?.p || 0) / 100 * totalPCM;
  // OS realizadas (do Fracttal) acumuladas até semana atual
  const osRealizadas = Object.entries(semMap)
    .filter(([s]) => parseInt(s) <= SEM)
    .reduce((acc,[,v]) => acc+v, 0);

  let accReal = 0;
  const chart = PCM.map(d => {
    accReal += (semMap[d.s]||0);
    let rp = null;
    if (d.s <= SEM) {
      rp = apiStatus==="ok"
        ? Math.min((accReal/totalPCM)*100, d.p).toFixed(2)
        : (d.p*0.91).toFixed(2);
    }
    return {
      sem:"S"+String(d.s).padStart(2,"0"), sn:d.s,
      plan:d.p, real:rp!==null?parseFloat(rp):null,
      mps:MPS_SEMS.has(d.s), mpa:MPA_SEMS.has(d.s),
    };
  });

  // Aderência real: OS realizadas / OS planejadas até agora
  const ader = apiStatus==="ok" && pcmAteSem>0
    ? Math.min(((osRealizadas/pcmAteSem)*100), 999).toFixed(1)
    : chart.find(d=>d.sn===SEM)?.real
      ? ((chart.find(d=>d.sn===SEM).real / (PCM.find(d=>d.s===SEM)?.p||1))*100).toFixed(1)
      : "—";
  const last = chart.find(d=>d.sn===SEM);
  const pMPS = chart.find(d=>d.mps&&d.sn>SEM);
  const pMPA = chart.find(d=>d.mpa&&d.sn>SEM);
  const lMPS = chart.filter(d=>d.mps&&d.sn>SEM&&d.sn<=SEM+12).slice(0,5);
  const lMPA = chart.filter(d=>d.mpa&&d.sn>SEM&&d.sn<=SEM+12).slice(0,5);

  return (
    <div className="fade">
      <div className="g4">
        <KCard label="Aderência ao PCM" value={ader+"%"} sub={"S"+SEM+" · Plan: "+(last?.plan?.toFixed(1)||"—")+"%"} color={parseFloat(ader)>=88?C.green:C.orange}/>
        <KCard label="Semana Atual" value={"S"+String(SEM).padStart(2,"0")} sub="de 52 semanas" color={C.blue}/>
        <KCard label="Próxima MPS" value={pMPS?"S"+String(pMPS.sn).padStart(2,"0"):"—"} sub={pMPS?"em "+(pMPS.sn-SEM)+" semanas":"—"} color={C.yellow}/>
        <KCard label="Próxima MPA" value={pMPA?"S"+String(pMPA.sn).padStart(2,"0"):"—"} sub={pMPA?"em "+(pMPA.sn-SEM)+" semanas":"—"} color={C.orange}/>
      </div>

      <div className="panel">
        <p className="ptitle">
          Curva S — PCM 52 Semanas · {totalPCM.toLocaleString("pt-BR")} atividades · 59 usinas
          {apiStatus==="ok" ? " · "+os.length+" OS Fracttal" : ""}
        </p>
        <ResponsiveContainer width="100%" height={290}>
          <ComposedChart data={chart} margin={{top:5,right:20,bottom:0,left:0}}>
            <CartesianGrid strokeDasharray="3 3" stroke={C.border}/>
            <XAxis dataKey="sem" tick={{fill:C.muted,fontSize:9}} tickFormatter={v=>v.replace("S","")} interval={3}/>
            <YAxis domain={[0,100]} tick={{fill:C.muted,fontSize:9}} tickFormatter={v=>v+"%"}/>
            <Tooltip content={<TT/>}/>
            <ReferenceLine x={"S"+String(SEM).padStart(2,"0")} stroke={C.blue} strokeDasharray="4 2"
              label={{value:"Hoje",fill:C.blue,fontSize:9,position:"insideTopRight"}}/>
            {chart.filter(d=>d.mps&&d.sn>SEM&&d.sn<=SEM+10).map(d=>(
              <ReferenceLine key={d.sem} x={d.sem} stroke="#e0c43a44" strokeDasharray="2 4"/>
            ))}
            {chart.filter(d=>d.mpa&&d.sn>SEM&&d.sn<=SEM+10).map(d=>(
              <ReferenceLine key={d.sem+"m"} x={d.sem} stroke="#e08e3a88" strokeDasharray="3 2"/>
            ))}
            <Area type="monotone" dataKey="plan" name="Planejado %" fill="#504C6322" stroke={C.dim} strokeWidth={2} dot={false}/>
            <Line type="monotone" dataKey="real" name="Realizado %" stroke={C.green} strokeWidth={2.5} dot={false} connectNulls={false}/>
          </ComposedChart>
        </ResponsiveContainer>
        <div style={{display:"flex",gap:18,marginTop:10,flexWrap:"wrap"}}>
          {[[C.dim,"Planejado"],[C.green,"Realizado"],[C.blue,"Semana atual"],[C.yellow,"MPS futuras"],[C.orange,"MPA futuras"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:14,height:2,background:c}}/>
              <span style={{color:C.muted,fontSize:10}}>{l}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="g2" style={{marginTop:14}}>
        {[["MPS — Próximas Semestrais",lMPS,C.yellow,"Semestral"],["MPA — Próximas Anuais",lMPA,C.orange,"Anual"]].map(([title,list,color,tipo])=>(

              : list.map(d=>(
                <div key={d.sem} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid "+C.border,fontSize:11}}>
                  <span style={{color:C.white}}>{d.sem}</span>
                  <span style={{color,fontWeight:600}}>+{d.sn-SEM} sem · {tipo}</span>
                </div>
              ))
            }
          </div>
        ))}
      </div>
    </div>
  );
}

      if (!m[s]) m[s]={ sem:"S"+String(s).padStart(2,"0"), prog:0, naoProg:0 };
      const a=(o.trigger_description||o.activator||o.trigger||"").toUpperCase();
      if (a.includes("NO_SCHEDULE")||a.includes("NAO_PROGRAM")||a.includes("NÃO_PROGRAM")||a.includes("UNPLANNED")) m[s].naoProg++;
      else m[s].prog++;
    });
    return Object.values(m).sort((a,b)=>a.sem.localeCompare(b.sem)).slice(-8);
  }, [os]);

  return (
    <div className="fade">
      <div className="g5">
        <KCard label="OS Programadas"     value={kpis?kpis.prog:"—"}    loading={loading} sub={(kpis?kpis.pctProg:"—")+"% do total"} color={C.green}/>
        <KCard label="OS Não Programadas" value={kpis?kpis.nprog:"—"}   loading={loading} sub={(kpis?kpis.pctNProg:"—")+"% do total"} color={C.red}/>
        <KCard label="MTTR"               value={kpis?kpis.mttr+"h":"—"} loading={loading} sub="Tempo médio de reparo" color={C.orange}/>
        <KCard label="Cumprimento PCM"    value={kpis?kpis.cumprimento+"%":"—"} loading={loading} sub="Meta > 90%" color={kpis&&parseFloat(kpis.cumprimento)>=90?C.green:C.orange}/>
        <KCard label="Taxa Resolução"     value={kpis?kpis.taxaRes+"%":"—"} loading={loading} sub="OS finalizadas / total" color={C.blue}/>
      </div>

      <div className="g2">
        <div className="panel">
          <p className="ptitle">OS Programadas vs Não Programadas{os.length>0?" (Fracttal — real)":""}</p>
          {semChart.length>0
            ? <ResponsiveContainer width="100%" height={200}>
                <BarChart data={semChart} margin={{top:3,right:8,bottom:0,left:-15}}>
                  <CartesianGrid strokeDasharray="3 3" stroke={C.border}/>
                  <XAxis dataKey="sem" tick={{fill:C.muted,fontSize:9}}/>
                  <YAxis tick={{fill:C.muted,fontSize:9}}/>
                  <Tooltip content={<TT/>}/>
                  <Bar dataKey="prog" name="Programadas" fill={C.green} radius={[3,3,0,0]} stackId="a"/>
                  <Bar dataKey="naoProg" name="Não Programadas" fill={C.red} radius={[3,3,0,0]} stackId="a"/>
                </BarChart>
              </ResponsiveContainer>
            : <div style={{height:200,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {loading ? <Spin size={28}/> : <span style={{color:C.muted,fontSize:11}}>Aguardando dados do Fracttal</span>}
              </div>
          }
        </div>

        <div className="panel">
          <p className="ptitle">Taxa de Reprogramação por Atividade (base histórica)</p>
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {REPROG.slice(0,7).map(x=>(
              <div key={x.a}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{color:C.white,fontSize:10}}>{x.a}</span>
                  <span style={{color:x.t>10?C.red:C.orange,fontSize:10,fontWeight:600}}>{x.t}%</span>
                </div>
                <div style={{background:C.border,borderRadius:3,height:4}}>
                  <div style={{width:Math.min(x.t*1.1,100)+"%",height:"100%",background:x.t>10?C.red:C.orange,borderRadius:3}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {kpis && <>
        <SecTitle>Distribuição por Tipo — últimos 30 dias (Fracttal)</SecTitle>
        <div className="g4">
          <KCard label="% Corretivas"    value={kpis.pctCorr+"%"}  sub="Meta < 30%"          color={C.red}/>
          <KCard label="% Preventivas"   value={kpis.pctPrev+"%"}  sub="Meta > 60%"           color={C.green}/>
          <KCard label="Total OS (30d)"  value={kpis.total}         sub={kpis.fin+" finalizadas"} color={C.blue}/>
          <KCard label="Taxa Resolução"  value={kpis.taxaRes+"%"}  sub="Finalizadas / Total"  color={C.green}/>
        </div>
      </>}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
const TABS = [
  {id:"curvaS",label:"Curva S — PCM"},
  {id:"manut", label:"Manutenção"},
  {id:"conf",  label:"Confiabilidade"},
  {id:"disp",  label:"Disponibilidade"},
  {id:"custo", label:"Custo"},
  {id:"seg",   label:"Segurança"},
];

function App() {
  const [tab, setTab] = useState("curvaS");
  const { status, os, err, load } = useFracttal();
  const kpis   = useMemo(() => calcKPIs(os), [os]);
  const isLoad = status==="loading";
  const isOk   = status==="ok";

  return (
    <div>
      {/* HEADER */}
      <div style={{background:C.panel,borderBottom:"1px solid "+C.border,padding:"11px 22px",
        display:"flex",alignItems:"center",gap:16,position:"sticky",top:0,zIndex:100}}>
        <Logo/>
        <div style={{width:1,height:24,background:C.border}}/>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:14}}>
          {isLoad && <div style={{display:"flex",alignItems:"center",gap:7}}>
            <Spin size={15}/><span style={{color:C.muted,fontSize:11}}>Conectando ao Fracttal...</span>
          </div>}
          {err && <span style={{color:C.red,fontSize:10}} title={err}>⚠ {err.slice(0,50)}</span>}
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:isOk?C.green:C.red,
              boxShadow:"0 0 5px "+(isOk?C.green:C.red)}}/>
            <span style={{color:C.muted,fontSize:11}}>
              {isOk ? "Fracttal · "+os.length+" OS" : status==="error" ? "Offline" : "Conectando..."}
            </span>
          </div>
          <button onClick={load} style={{background:C.card,color:C.green,border:"1px solid "+C.green,
            borderRadius:6,padding:"3px 11px",fontSize:11,cursor:"pointer",fontFamily:"'Barlow',sans-serif"}}>
            ⟳ Atualizar
          </button>
        </div>
      </div>

      {/* TÍTULO */}
      <div style={{padding:"16px 22px 0"}}>
        <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:20,letterSpacing:1}}>
          Dashboard RCM <span style={{color:C.green}}>—</span> Grid Co.
        </h1>
        <p style={{color:C.muted,fontSize:11,marginTop:3}}>
          Semana {SEM}/52 &nbsp;·&nbsp; PCM: 11.711 atividades · 59 usinas
          {isOk && " · "+os.length+" tarefas carregadas (jan–hoje)"}
        </p>
      </div>

      {/* TABS */}
      <div style={{padding:"12px 22px 0",display:"flex",gap:6,flexWrap:"wrap",borderBottom:"1px solid "+C.border}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{padding:"6px 14px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,
              letterSpacing:"0.5px",fontFamily:"'Barlow',sans-serif",transition:"all 0.15s",
              background:tab===t.id?C.green:C.card, color:tab===t.id?C.bg:C.muted,
              fontWeight:tab===t.id?700:400}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* CONTEÚDO */}
      <div style={{padding:"10px 22px 50px"}}>
        {tab==="curvaS" && <CurvaSTab os={os} apiStatus={status}/>}
        {tab==="manut"  && <ManutencaoTab os={os} kpis={kpis} loading={isLoad}/>}
        {tab==="conf"   && <ConfiabilidadeTab kpis={kpis}/>}
        {tab==="disp"   && <DisponibilidadeTab/>}
        {tab==="custo"  && <CustoTab/>}
        {tab==="seg"    && <SegurancaTab/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
